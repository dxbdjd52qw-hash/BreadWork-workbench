# 麺包的工作台 · Nginx 传输与安全优化
#
# 用法：保存为 /etc/nginx/conf.d/ytwb-optimize.conf 后执行
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：本文件位于 http 上下文（conf.d/*.conf 被 include 进 http 块），
#       gzip 与 add_header 在此级别对所有 server 生效，不影响 certbot 管理的 ytwb.conf。
#       HTTP/2 需要在 ytwb.conf 的 443 server 段把 listen 改为：
#         listen 443 ssl http2;        # Nginx < 1.25.1
#         listen 443 ssl; http2 on;    # Nginx >= 1.25.1

# ---------- gzip 压缩（首页 127KB → 约 25–30KB，手机弱网提速明显） ----------
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml
    application/manifest+json;

# ---------- 安全响应头 ----------
# 注意：HSTS 会让浏览器在此后一年内强制走 HTTPS。
#       若担心证书出问题后无法回退，可先把 max-age 改成 86400（1 天）观察一段时间。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
